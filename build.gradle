buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.version
group = 'io.github.zgxhzhr.meowarchive'
archivesBaseName = 'meowarchive-forge-1.8.9'

sourceCompatibility = targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

repositories {
    mavenCentral()
}

processResources {
    inputs.property 'version', project.version
    // Gradle 2.x 默认按平台编码（Windows 上是 GBK）读取资源，mcmod.info 里的中文会乱码
    filteringCharset = 'UTF-8'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.8.9'
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "meowarchive",
                "Specification-Vendor"    : "zgxhzhr",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "zgxhzhr",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
