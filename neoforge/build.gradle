plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

neoForge {
    version = neoforge_version
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

def expandProps = [
        version                     : version,
        group                       : project.group,
        minecraft_version           : minecraft_version,
        minecraft_version_range     : minecraft_version_range,
        mod_name                    : mod_name,
        mod_author                  : mod_author,
        mod_id                      : mod_id,
        license                     : license,
        description                 : project.description,
        java_version                : java_version,
        credits                     : credits,
        neoforge_version            : neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
]

processResources {
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}
