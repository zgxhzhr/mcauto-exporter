# 官方映射（mojmap） -> ForgeGradle 6 在 1.16.5 上使用的「MCP 类名」。
# ForgeGradle 6 的 official 通道在 1.17 之前只提供 MCP 类名，NFRT 又完全不支持 1.16.5，
# 因此 common 源码保持 mojmap，构建 Forge 时用本表机械替换类名（成员名两边一致）。
# 格式：fqn.<序号>=<mojmap 全名>|<MCP 全名>；simple.<序号>=<旧简单名>|<新简单名>
