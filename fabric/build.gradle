plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

loom {
    mixin {
        defaultRefmapName = 'meowarchive.refmap.json'
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            if (project.hasProperty('quickWorld')) {
                programArgs '--quickPlaySingleplayer', project.property('quickWorld').toString()
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def expandProps = [
        version                  : version,
        group                    : project.group,
        minecraft_version        : minecraft_version,
        minecraft_version_range  : minecraft_version_range,
        fabric_version           : fabric_version,
        fabric_loader_version    : fabric_loader_version,
        mod_name                 : mod_name,
        mod_author               : mod_author,
        mod_id                   : mod_id,
        license                  : license,
        description              : project.description,
        java_version             : java_version,
        credits                  : credits
]

processResources {
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}
