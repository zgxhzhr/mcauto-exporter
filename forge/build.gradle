plugins {
    id 'net.minecraftforge.gradle'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    // Forge 1.20.6 及以后运行时直接使用 official 映射，不需要再 reobf 到 SRG
    reobf = false

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('quickWorld')) {
                args '--quickPlaySingleplayer', project.property('quickWorld').toString()
            }
        }
        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

def expandProps = [
        version                     : version,
        group                       : project.group,
        minecraft_version           : minecraft_version,
        minecraft_version_range     : minecraft_version_range,
        mod_name                    : mod_name,
        mod_author                  : mod_author,
        mod_id                      : mod_id,
        license                     : license,
        description                 : project.description,
        java_version                : java_version,
        credits                     : credits,
        forge_version               : forge_version,
        forge_loader_version_range  : forge_loader_version_range
]

processResources {
    inputs.properties(expandProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
                // Forge 1.21 的 MixinPlatformAgentMinecraftForge 会拒绝非 Minecraft 容器，
                // 之后回落到默认 agent，而它只从清单的 MixinConfigs 读取配置。
                'MixinConfigs'          : 'meowarchive.mixins.json'
        ])
    }
}
