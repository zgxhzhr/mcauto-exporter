# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.1
group=io.github.zgxhzhr.meowarchive
java_version=8

# Common
minecraft_version=1.14.4
mod_name=Meow Archive Exporter
mod_author=zgxhzhr
mod_id=meowarchive
license=MIT
credits=
description=Meow Archive Exporter: client-side exporter for Minecraft mod content. Dumps LMS-format JSON, 32/128 icons and an HTML preview for items, entities and effects.
minecraft_version_range=[1.14.4, 1.15)

# Fabric
fabric_version=0.28.5+1.14
fabric_loader_version=0.14.12

# Forge
forge_version=28.2.30
forge_loader_version_range=[28,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
