# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.0
group=io.github.zgxhzhr.meowarchive
java_version=17

# Common
minecraft_version=1.20.4
mod_name=Meow Archive Exporter
mod_author=zgxhzhr
mod_id=meowarchive
license=MIT
credits=
description=Meow Archive Exporter: client-side exporter for Minecraft mod content. Dumps LMS-format JSON, 32/128 icons and an HTML preview for items, entities and effects.
minecraft_version_range=[1.20.4, 1.20.5)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.4
parchment_version=2024.04.14

# Fabric
fabric_version=0.97.2+1.20.4
fabric_loader_version=0.16.9

# Forge
forge_version=49.2.13
forge_loader_version_range=[49,)

# NeoForge
neoforge_version=20.4.253
# javafml 语言版本（NeoForge 20.2/20.4 均为 1），对应 mods.toml 的 loaderVersion
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
