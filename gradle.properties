# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.1
group=io.github.zgxhzhr.meowarchive
java_version=25

# Common
minecraft_version=26.3
mod_name=Meow Archive Exporter
mod_author=zgxhzhr
mod_id=meowarchive
license=MIT
